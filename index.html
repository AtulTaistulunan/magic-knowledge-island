<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AI 題目知識島｜從 AI 出題、品質診斷到命題修訂的探索旅程</title>
<meta name="description" content="國小四年級自然科「水的流動」單元的 AI 輔助命題歷程：三棟知識建築與六個真實修訂案例。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2e2418; --ink2:#54463a; --muted:#7a6a58;
  --cream:#fbf4e3; --cream2:#f5ead2; --line:#e3d2ad;
  --blue:#3d6fc0; --blue-d:#264f93; --blue-l:#e6eefb;
  --orange:#d9782b; --orange-d:#9c4f12; --orange-l:#fdeedd;
  --green:#3f9658; --green-d:#24693a; --green-l:#e3f3e6;
  /* 魔法學院夜晚主題 */
  --night:#0e1430; --night2:#1b2350; --wine:#6b2433; --wine-d:#3a1520;
  --gold:#d8b26a; --gold-l:#f3e0a8; --gold-d:#a8823c; --parch:#efe2c4;
  --glass:linear-gradient(180deg,rgba(26,30,66,.88),rgba(14,17,40,.9)); --glass-line:rgba(216,178,106,.5);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --wood:#a87b4f; --pass:#1f9a7a; --fail:#d9682a;
  --warn-bg:#fff4d6; --warn-line:#e7b93e; --warn-ink:#6b4a00;
  --danger-bg:#fde8e4; --danger-line:#d9634f; --danger-ink:#8a2414;
  --radius:16px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%}
/* 魔法學院傍晚：以低飽和藍紫為主，只在地平線留一道柔和的粉橘晚霞 */
body{background:radial-gradient(ellipse 80% 30% at 22% 96%,rgba(240,176,140,.38),transparent 70%),linear-gradient(180deg,#2a3160 0%,#414878 30%,#686a96 56%,#a891ab 80%,#dcb5a3 100%);background-color:#414878}
button{font-family:inherit;color:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;z-index:1}
/* 月亮固定在畫面右上方的背景（位於 3D 畫布後面） */
#moon{position:fixed;z-index:0;top:7vh;right:20vw;width:min(15vw,130px);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 62% 40%,rgba(160,150,120,.35) 0 8%,transparent 9%),radial-gradient(circle at 38% 64%,rgba(160,150,120,.3) 0 6%,transparent 7%),radial-gradient(circle at 30% 30%,rgba(160,150,120,.22) 0 5%,transparent 6%),radial-gradient(circle at 40% 36%,#fffbea,#ece4c6 58%,#cfc5a4);
  opacity:.82;box-shadow:0 0 40px 10px rgba(255,236,214,.3),0 0 120px 50px rgba(255,200,190,.14)}
@media (max-width:760px){#moon{top:auto;bottom:16vh;right:7vw;width:62px}}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar ---------- */
#topbar{position:fixed;top:14px;left:14px;max-width:min(430px,calc(100vw - 28px));z-index:20;color:var(--parch);
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--glass-line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.04);padding:14px 18px 12px}
#topbar .orn{display:flex;align-items:center;gap:.5rem;font-family:var(--serif);font-size:.72rem;letter-spacing:.32em;color:var(--gold);font-weight:700;margin-bottom:.15rem}
#topbar .orn::before,#topbar .orn::after{content:"";flex:1;max-width:2.2rem;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
#topbar .orn::after{background:linear-gradient(90deg,var(--gold),transparent)}
#topbar h1{margin:0;font-family:var(--serif);font-size:1.6rem;font-weight:900;letter-spacing:.06em;line-height:1.25;display:flex;align-items:center;gap:.45rem;color:var(--gold-l);text-shadow:0 0 18px rgba(243,224,168,.35),0 2px 0 rgba(0,0,0,.4)}
#topbar h1 .logo{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a3446,var(--wine-d));border:1.5px solid var(--gold);color:var(--gold-l);font-size:.95rem;text-shadow:none;box-shadow:0 0 12px rgba(216,178,106,.45)}
#topbar .sub{margin:.3rem 0 0;font-family:var(--serif);font-size:.95rem;color:#eadfc4;font-weight:600;font-style:italic}
#topbar details{margin-top:.55rem}
#topbar summary{cursor:pointer;font-size:.85rem;color:var(--gold);font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:.3rem}
#topbar summary::-webkit-details-marker{display:none}
#topbar summary::before{content:"▸";transition:transform .2s}
#topbar details[open] summary::before{transform:rotate(90deg)}
#topbar summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
#topbar .intro{margin:.4rem 0 0;font-size:.9rem;line-height:1.75;color:#d9cfb8}
.hint{margin-top:.6rem;display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:#e7dcc4;background:rgba(255,255,255,.05);border:1px dashed rgba(216,178,106,.45);border-radius:999px;padding:.25rem .7rem}
.hint .touch{display:none}
@media (hover:none) and (pointer:coarse){.hint .mouse{display:none}.hint .touch{display:inline}}

/* ---------- 3D labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.blabel{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;
  display:flex;align-items:center;gap:.35rem;white-space:nowrap;padding:.26rem .65rem .26rem .3rem;border-radius:999px;
  background:rgba(20,25,56,.86);border:1px solid rgba(216,190,140,.55);color:#f1e3bd;
  box-shadow:0 3px 10px rgba(10,12,30,.35);font-family:var(--serif);font-size:.82rem;font-weight:700;letter-spacing:.02em;
  transform:translate(-50%,-100%);transform-origin:50% 100%;transition:background .2s,border-color .2s,scale .2s;will-change:transform}
.blabel .num{display:inline-grid;place-items:center;width:1.25rem;height:1.25rem;border-radius:50%;color:#fff;font-size:.72rem;font-weight:900;flex:none;font-family:var(--font)}
.blabel .go{font-size:.72rem;font-weight:600;color:#cdbb92;max-width:0;overflow:hidden;transition:max-width .3s cubic-bezier(.22,1,.36,1)}
.blabel::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:rgba(216,190,140,.75)}
/* 滑鼠移入：略微放大、顯示主題副標，不發光 */
.blabel.hot,.blabel:hover,.blabel:focus-visible{background:rgba(28,34,74,.95);border-color:rgba(232,210,160,.9);scale:1.06}
.blabel.hot .go,.blabel:hover .go,.blabel:focus-visible .go{max-width:9em}
.blabel:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
.b-history .num{background:var(--blue)} .b-diagnosis .num{background:var(--orange)} .b-strategy .num{background:var(--green)} .b-about .num{background:var(--wine)}
/* 角色的對話泡泡：羊皮紙底、深色字，位置跟著角色移動 */
#charBubble{position:fixed;left:0;top:0;z-index:12;pointer-events:none;max-width:min(240px,70vw);
  padding:.45rem .7rem;border-radius:12px;background:#fbf4e3;color:var(--ink);border:1px solid rgba(168,130,60,.55);
  box-shadow:0 6px 16px rgba(10,12,30,.3);font-size:.84rem;line-height:1.55;font-weight:500;
  opacity:0;transition:opacity .2s;will-change:transform}
#charBubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-bottom:0;border-top-color:#fbf4e3}
#charBubble.show{opacity:1}
/* 學院城堡不是知識館：用較小、較淡的次要名牌 */
.blabel.b-about{font-size:.74rem;padding:.2rem .55rem .2rem .25rem;background:rgba(20,25,56,.7)}
.blabel.b-about .num{width:1.05rem;height:1.05rem;font-size:.62rem}

/* ---------- Dock ---------- */
#dock{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.04);border:1px solid var(--glass-line);max-width:calc(100vw - 20px)}
#dock button{border:0;background:transparent;color:#f1e6cc;border-radius:999px;padding:.55rem .95rem;font-family:var(--serif);font-size:.95rem;font-weight:700;letter-spacing:.03em;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;transition:background .15s,transform .1s,color .15s}
#dock button:hover{background:rgba(216,178,106,.16);color:var(--gold-l)}
#dock button:active{transform:scale(.96)}
#dock button:focus-visible{outline:2px solid var(--gold-l);outline-offset:1px}
#dock .dot{width:.72rem;height:.72rem;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px rgba(243,224,168,.7),0 0 8px currentColor}
#dock .sep{width:1px;background:rgba(216,178,106,.4);margin:4px 2px}
#dock .short{display:none}
#musicBtn[hidden]{display:none}
#musicBtn[aria-pressed="true"]{background:rgba(216,178,106,.24);color:var(--gold-l)}
#musicBtn[aria-pressed="true"] .note{animation:notebob 1.2s ease-in-out infinite}
@keyframes notebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
html.reduce-motion #musicBtn .note{animation:none!important}   /* 跟著下方選單的動畫開關（預設跟隨系統的減少動態效果） */
/* 動畫開關：和「音樂」按鈕同一種樣式，開啟時底色變金色 */
#motionBtn[aria-pressed="true"]{background:rgba(216,178,106,.24);color:var(--gold-l)}
#motionBtn .ico{display:inline-block;width:1em;text-align:center}
/* 點擊音效開關：和「音樂」「動畫」按鈕同一種樣式 */
#sfxBtn[aria-pressed="true"]{background:rgba(216,178,106,.24);color:var(--gold-l)}
#sfxBtn .ico{display:inline-block;width:1em;text-align:center}
#dock{transition:left .55s cubic-bezier(.22,1,.36,1)}
@media (min-width:761px){body.panel-open #dock{left:calc((100vw - min(620px,100vw)) / 2)} body.panel-open #topbar details, body.panel-open #topbar .hint{display:none}}
/* 桌面寬度但面板打開時，下方選單只能用面板左邊的空間：改成短名稱、音樂與動畫只留圖示，避免超出畫面或被面板蓋住 */
@media (min-width:761px){
  body.panel-open #dock{max-width:calc(100vw - min(620px,100vw) - 24px)}
  body.panel-open #dock .long{display:none} body.panel-open #dock .short{display:inline}
  body.panel-open #dock button{padding:.5rem .6rem;font-size:.86rem;letter-spacing:0}
}
@media (min-width:761px) and (max-width:1180px){
  body.panel-open #homeBtn .short, body.panel-open #dock [data-open="about"] .short{display:none}
}
/* 加了「音效」按鈕後，面板旁邊最窄的情況（約 1081–1120）按鈕間距再收一點，避免選單超出 */
@media (min-width:761px) and (max-width:1120px){
  body.panel-open #dock button{padding:.5rem .48rem}
}
/* 中等寬度（例如平板橫放）面板關閉時：建築用短名稱，音樂與動畫只留圖示 */
@media (min-width:761px) and (max-width:1000px){
  #dock .long{display:none} #dock .short{display:inline}
}
/* 面板打開時，面板左邊少於約 450 像素就放不下選單：先收起下方選單；面板上方有「返回島嶼全景」與關閉按鈕，也可用快捷鍵 1、2、3 */
@media (min-width:761px) and (max-width:1080px){
  body.panel-open #dock{visibility:hidden}
}
.iconbtn .stxt{display:none}
@media (max-width:760px){
  #dock{gap:0;padding:4px}
  #dock button{padding:.55rem .45rem;font-size:.8rem;gap:.28rem;letter-spacing:0}
  #dock .dot{width:.6rem;height:.6rem}
  #dock .long{display:none}#dock .short{display:inline}
  #topbar{top:10px;left:10px;padding:10px 12px}
  #topbar h1{font-size:1.2rem}
  #topbar .sub{font-size:.8rem}
  .blabel{font-size:.74rem;padding:.22rem .5rem .22rem .26rem}
  .blabel .num{width:1.1rem;height:1.1rem;font-size:.66rem}
}
/* 加了音樂按鈕後，窄手機的「全景」「說明」只留圖示 */
@media (max-width:430px){
  #homeBtn .short,#dock [data-open="about"] .short{display:none}
}
/* 小螢幕手機（寬度 360 以下）：選單和標題卡再縮一點，避免「說明」被切掉 */
@media (max-width:360px){
  #dock button{padding:.5rem .3rem;font-size:.74rem;gap:.2rem}
  #dock .dot{width:.5rem;height:.5rem}
  #dock .sep{margin:4px 0}
  .hint{font-size:.7rem;padding:.2rem .5rem}
  #topbar .sub{font-size:.74rem}
}

/* ---------- Overlays ---------- */
#loading,#error{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none}
#loading .box{background:var(--glass);border:1px solid var(--glass-line);color:var(--gold-l);font-family:var(--serif);border-radius:var(--radius);padding:18px 24px;box-shadow:0 12px 30px rgba(0,0,0,.5);text-align:center;font-weight:700;letter-spacing:.06em}
#error .box{background:var(--cream);border-radius:var(--radius);padding:18px 22px;box-shadow:0 12px 30px rgba(0,0,0,.5);text-align:center;font-weight:700}
#loading .spin{width:34px;height:34px;margin:0 auto 10px;border-radius:50%;border:3px solid rgba(216,178,106,.25);border-top-color:var(--gold-l);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading.hide{opacity:0;transition:opacity .5s;visibility:hidden}
#error{display:none;pointer-events:auto;padding:20px}
#error .box{max-width:460px;text-align:left;font-weight:400;line-height:1.7;border:2px solid var(--danger-line)}
#error h2{margin:0 0 .4rem;font-size:1.1rem;color:var(--danger-ink)}

/* ---------- Panel ---------- */
#panel{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);z-index:30;background:var(--cream);border-left:2px solid var(--gold);
  box-shadow:-12px 0 40px rgba(0,0,0,.5);display:flex;flex-direction:column;transform:translateX(105%);
  transition:transform .55s cubic-bezier(.22,1,.36,1),visibility 0s linear .55s;visibility:hidden;will-change:transform}
#panel.open{transition:transform .55s cubic-bezier(.22,1,.36,1),visibility 0s}
#panel.open{transform:none;visibility:visible}
@media (max-width:760px){
  #panel{width:100%;transform:translateY(105%)}
  #panel.open{transform:none}
}
.p-head{flex:none;padding:18px 18px 10px;border-bottom:2px solid var(--gold);position:relative;color:var(--parch);
  background:radial-gradient(ellipse 80% 120% at 100% 0%,rgba(92,112,200,.28),transparent 60%),linear-gradient(180deg,#1b2148,#11152f)}
.p-head::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--accent,#999),var(--gold) 55%,var(--accent,#999))}
.p-top{display:flex;align-items:flex-start;gap:10px}
.p-icon{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;background:radial-gradient(circle at 35% 30%,var(--accent,#777),#0d1028 95%);border:1.5px solid var(--gold);box-shadow:0 0 14px rgba(216,178,106,.35)}
.p-title{flex:1;min-width:0}
.p-title h2{margin:2px 0 0;font-family:var(--serif);font-size:1.4rem;font-weight:900;letter-spacing:.05em;color:var(--gold-l);text-shadow:0 0 14px rgba(243,224,168,.25)}
.p-title .kicker{font-size:.78rem;color:#cdbf9f;font-weight:700;letter-spacing:.1em}
.p-actions{display:flex;gap:6px;flex:none}
.iconbtn{border:1px solid var(--glass-line);background:rgba(255,255,255,.06);color:#f1e6cc;border-radius:10px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;font-size:.88rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.iconbtn:hover{background:rgba(216,178,106,.18);color:var(--gold-l)}
.iconbtn:focus-visible{outline:2px solid var(--gold-l);outline-offset:1px}
.iconbtn.close{font-size:1.25rem}
.p-intro{margin:.6rem 0 .2rem;font-size:.93rem;line-height:1.75;color:#ddd1b6}
.p-nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin;scrollbar-color:var(--gold-d) transparent}
.p-nav button{flex:none;border:1px solid rgba(216,178,106,.4);background:rgba(255,255,255,.05);border-radius:999px;padding:.35rem .75rem;font-size:.82rem;font-weight:700;cursor:pointer;color:#e9dcc0}
.p-nav button:hover,.p-nav button.on{background:var(--accent);border-color:var(--gold-l);color:#fff}
.p-nav button:focus-visible{outline:2px solid var(--gold-l);outline-offset:1px}
.p-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 18px calc(40px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 120px),var(--cream)}
.sec{scroll-margin-top:12px;margin-bottom:22px}
.sec>h3{font-family:var(--serif);font-size:1.12rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.45rem;font-weight:900;color:#3a2614;padding-bottom:.3rem;border-bottom:1px solid rgba(168,130,60,.35)}
.sec>h3 .n{display:inline-grid;place-items:center;min-width:1.6rem;height:1.6rem;border-radius:8px;background:var(--accent-l);color:var(--accent-d);font-size:.82rem;padding:0 .3rem}
.card{background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 0 rgba(168,130,60,.12)}
.card p{margin:.3rem 0;line-height:1.75}
.card ul,.card ol{margin:.3rem 0;padding-left:1.35rem;line-height:1.75}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;font-size:.93rem;line-height:1.6}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.8rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:var(--cream2);border:1px solid var(--line);color:var(--ink2)}
.chip.b-history{background:var(--blue-l);border-color:#b9d2ee;color:var(--blue-d)}
.chip.b-diagnosis{background:var(--orange-l);border-color:#f3c9a3;color:var(--orange-d)}
.chip.b-strategy{background:var(--green-l);border-color:#bfdcb8;color:var(--green-d)}
blockquote.prompt{margin:0;padding:12px 14px;background:#f7f3ea;border-left:5px solid var(--accent);border-radius:8px;line-height:1.85;font-size:.95rem}
.note{font-size:.84rem;color:var(--muted);line-height:1.7}
.callout{border-radius:12px;padding:11px 14px;margin:8px 0;line-height:1.75;font-size:.92rem;border:1px solid}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.callout.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}
.callout.info{background:var(--blue-l);border-color:#b9d2ee;color:#1f4c7c}
.callout b{font-weight:900}
.linkbtn{border:0;background:none;padding:0;color:var(--blue-d);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.linkbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative;margin:4px 0 10px}
.tl::before{content:"";position:absolute;left:12%;right:12%;top:22px;height:4px;background:#dfe9dc;border-radius:4px}
.tl button{position:relative;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 2px;font-size:.8rem;font-weight:700;color:var(--ink2);line-height:1.35}
.tl .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #cfdcc9;font-size:1rem;font-weight:900;color:var(--ink2);transition:all .2s}
.tl button.on .dot{background:var(--blue);border-color:var(--blue-d);color:#fff;transform:scale(1.08)}
.tl button.on{color:var(--ink)}
.tl button:focus-visible .dot{outline:3px solid var(--blue);outline-offset:2px}
.tl-detail h4{margin:0 0 .3rem;font-size:1.02rem}
.tl-detail h5{margin:.7rem 0 .2rem;font-size:.9rem;color:var(--muted)}
.relcase{margin-top:.6rem;display:flex;flex-wrap:wrap;gap:6px}

/* flow */
.flow{display:flex;flex-direction:column;gap:6px;counter-reset:step}
.flow .step{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:.93rem}
.flow .who{flex:none;font-size:.75rem;font-weight:900;padding:.15rem .5rem;border-radius:6px}
.who.h{background:#fff0d6;color:#7a4a00}.who.ai{background:#e3ecfb;color:#1f4c7c}
.flow .step::before{counter-increment:step;content:counter(step);flex:none;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;background:var(--cream2);font-size:.8rem;font-weight:900}
.motto{margin:10px 0 0;text-align:center;font-weight:900;font-size:1rem;padding:10px;border-radius:12px;background:var(--accent-l);color:var(--accent-d)}

/* stats chart */
.legend{display:flex;gap:14px;font-size:.84rem;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.bars{display:flex;flex-direction:column;gap:12px}
.barrow .lab{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700;margin-bottom:4px;gap:8px}
.barrow .lab small{font-weight:500;color:var(--muted)}
.track{display:flex;gap:2px;height:26px;border-radius:6px;position:relative}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900;color:#fff;min-width:0;position:relative;cursor:default;outline:none}
.seg.pass{background:var(--pass);border-radius:6px 0 0 6px}
.seg.fail{background:var(--fail);border-radius:0 6px 6px 0}
.seg.only{border-radius:6px}
.seg .tt{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#283629;color:#fff;font-weight:500;font-size:.78rem;padding:.3rem .55rem;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2}
.seg:hover .tt,.seg:focus .tt{opacity:1}
/* 提示文字靠齊所在區段的同一側，避免超出面板造成手機上可以左右滑動 */
.seg.pass .tt{left:0;transform:none}
.seg.fail .tt{left:auto;right:0;transform:none}
.barrow.key .lab{color:var(--orange-d)}
.statbig{display:flex;align-items:center;gap:14px}
.statbig .num{white-space:nowrap;flex:none;font-size:2.4rem;font-weight:900;color:var(--orange-d);line-height:1}
.statbig .num small{font-size:1rem;color:var(--muted);font-weight:700}
table.data{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left}
table.data td.r,table.data th.r{text-align:right}
.toggle-table{margin-top:8px}

/* indicator cards */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.ind{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ind h4{margin:0 0 .2rem;font-size:.98rem}
.ind p{margin:0;font-size:.86rem;line-height:1.65;color:var(--ink2)}

/* case selector + card */
.casepick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.casepick button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:.45rem .7rem;font-size:.84rem;font-weight:700;cursor:pointer;text-align:left;line-height:1.35;color:var(--ink2)}
.casepick button b{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.casepick button.on{border-color:var(--accent);background:var(--accent-l);color:var(--ink)}
.casepick button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.casecard{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.cc-head{padding:12px 14px 10px;background:linear-gradient(180deg,#fffdf7,#fff);border-bottom:1px solid var(--line)}
.cc-head h4{margin:0;font-size:1.06rem;font-weight:900}
.cc-head .id{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.08em}
.numchain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;font-size:.8rem}
.numchain .nc{padding:.15rem .5rem;border-radius:6px;background:var(--cream2);border:1px solid var(--line);font-weight:700}
.numchain .arr{color:var(--muted)}
.cc-tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 10px 0;border-bottom:1px solid var(--line);background:#fffdf8;scrollbar-width:thin}
.cc-tabs button{flex:none;border:0;background:none;padding:.5rem .7rem;font-size:.85rem;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);border-radius:8px 8px 0 0}
.cc-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:#fff}
.cc-tabs button.v2{color:var(--danger-ink)}
.cc-tabs button.v2[aria-selected="true"]{border-bottom-color:var(--danger-line)}
.cc-tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.cc-body{padding:12px 14px 14px}
.cc-src{padding:8px 14px 12px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);line-height:1.65}
.q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fffefb}
.q-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.vtag{font-size:.75rem;font-weight:900;padding:.15rem .5rem;border-radius:6px;background:#eef1ec;color:#3c4a3e}
.vtag.v1{background:#eceff3;color:#3d4a5c}.vtag.v2{background:var(--danger-bg);color:var(--danger-ink)}.vtag.v3{background:var(--green-l);color:var(--green-d)}
.qnum{font-size:.78rem;color:var(--muted);font-weight:700}
.examhead{margin:4px 0 8px;padding:6px 10px;border:2px dashed var(--fail);border-radius:8px;background:#fff7f0;font-size:.9rem}
.examhead .tag{display:block;font-size:.72rem;color:var(--orange-d);font-weight:900;margin-bottom:2px}
.stem{margin:.2rem 0 .5rem;line-height:1.85;font-size:.98rem}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.opts li{display:flex;gap:.5rem;align-items:flex-start;padding:.45rem .6rem;border-radius:9px;border:1px solid #eee6d6;background:#fff;line-height:1.65;font-size:.94rem;flex-wrap:wrap}
.opts .L{flex:none;font-weight:900;color:var(--ink2);min-width:2.1em}
.opts .T{flex:1;min-width:10em}
.opts li.correct{border-color:#7cc3a9;background:#eef8f3}
.opts li.correct .L{color:#16735a}
.opts li.aiset{border-color:#9db8dd;background:#f0f5fc}
.opts li.dual{border-color:var(--danger-line);background:#fff3f0}
.badge{flex:none;font-size:.72rem;font-weight:900;padding:.12rem .45rem;border-radius:6px;margin-left:auto;align-self:center}
.badge.ok{background:#d5efe4;color:#0f5c47}
.badge.ai{background:#dce7f6;color:#1f4c7c}
.badge.dual{background:#fbd9d1;color:var(--danger-ink)}
.ansline{margin:.6rem 0 0;font-size:.9rem;font-weight:700}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.dg{display:flex;flex-direction:column;gap:8px}
.dg .item{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:#fffefb}
.dg .item h5{margin:0 0 .2rem;font-size:.84rem;letter-spacing:.04em}
.dg .item p{margin:0;line-height:1.75;font-size:.93rem}
.dg .item.prob{border-left:5px solid var(--fail)}
.dg .item.fix{border-left:5px solid var(--pass)}
.dg .item.pr{border-left:5px solid var(--blue)}
.princ{display:flex;flex-direction:column;gap:8px}
.pr-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pr-card h4{margin:0 0 .25rem;font-size:.98rem;display:flex;gap:.4rem;align-items:baseline}
.pr-card h4 .pn{flex:none;font-size:.75rem;font-weight:900;color:#fff;background:var(--green);border-radius:6px;padding:.1rem .45rem}
.pr-card p{margin:0 0 .35rem;font-size:.9rem;line-height:1.7;color:var(--ink2)}
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;line-height:1.6;font-size:.92rem}
.check input{width:1.15rem;height:1.15rem;margin-top:.2rem;accent-color:var(--green);flex:none}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.pending{counter-reset:pd;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.pending li{display:flex;gap:.6rem;padding:.6rem .75rem;border-radius:10px;background:var(--warn-bg);border:1px solid #f0d78e;line-height:1.7;font-size:.9rem;color:#4f3a06}
.pending li::before{counter-increment:pd;content:counter(pd);flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:#e7b93e;color:#fff;display:grid;place-items:center;font-weight:900;font-size:.8rem;margin-top:.1rem}
.foot{margin-top:24px;padding:12px 14px;border-radius:12px;background:#f3eee2;font-size:.84rem;line-height:1.75;color:var(--ink2)}
.kbd{display:inline-block;border:1px solid #cfc4ab;border-bottom-width:2px;border-radius:5px;padding:0 .35rem;font-size:.8rem;background:#fff;font-family:inherit}
@media (max-width:760px){
  .p-head{padding:12px 14px 8px}
  .p-title h2{font-size:1.15rem}
  .p-icon{width:38px;height:38px;font-size:1.15rem}

  .tl button{font-size:.72rem}
}

function renderQuestion(v, mode){
  var h='<div class="q"><div class="q-meta"><span class="vtag '+v.cls+'">'+esc(v.tag)+'</span><span class="qnum">'+esc(v.num)+'</span></div>';
  if(v.examHeader){h+='<div class="examhead"><span class="tag">原始試卷上方的大標題（會提示答案）</span>'+esc(v.examHeader)+'</div>';}
  h+='<p class="stem">'+esc(v.stem)+'</p><ol class="opts">';
  v.options.forEach(function(o){
    var cls="",badge="";
    if(v.answer && o[0]===v.answer){cls="correct";badge='<span class="badge ok">✓ 正確答案</span>';}
    if(v.aiAnswer && o[0]===v.aiAnswer){cls="aiset";badge='<span class="badge ai">AI 設定的答案</span>';}
    if(v.dual && o[0]===v.dual){cls="dual";badge='<span class="badge dual">⚠ 學生指出也可能成立</span>';}
    h+='<li class="'+cls+'"><span class="L">('+o[0]+')</span><span class="T">'+esc(o[1])+'</span>'+badge+'</li>';
  });
  h+='</ol>';
  if(v.answer){h+='<p class="ansline">正確答案：'+v.answer+'</p>';}
  if(v.aiAnswer){
    h+='<p class="ansline">AI 原本設定的正確答案：'+v.aiAnswer+'</p>';
    h+='<div class="callout danger"><b>第二版發現雙重答案</b><br>'+esc(v.issue)+'<br>因此此版本的 C 不應視為確定錯誤的選項；學生發現後，要求重新設計本題（見第三版）。</div>';
  }
  return h+'</div>';
}

      tabs.map(function(t,i){return '<button type="button" role="tab" id="tab-'+uid+'-'+t[0]+'" aria-controls="tp-'+uid+'" aria-selected="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'" data-t="'+t[0]+'"'+(t[0]==="v2"?' class="v2"':'')+'>'+(t[0]==="v2"?"⚠ ":"")+t[1]+'</button>';}).join("")+
    '</div><div class="cc-body" role="tabpanel" id="tp-'+uid+'"></div>'+
    '<div class="cc-src"><b>資料來源：</b>'+c.sources.map(esc).join(" ")+(c.v2?'<br><b>版本說明：</b>本案例呈現初版、第二版（雙重答案）與第三版三個版本。':'')+'</div>'+
  '</article>');
  var body=card.querySelector(".cc-body");
  function show(t){
    card.querySelectorAll('[role="tab"]').forEach(function(b){var on=b.dataset.t===t;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1;});
    body.setAttribute("aria-labelledby","tab-"+uid+"-"+t);
    var h="";
    if(t==="original") h=renderQuestion(c.original);
    else if(t==="v2") h=renderQuestion(c.v2);
    else if(t==="revised") h=renderQuestion(c.revised);
    else if(t==="compare"){
      h='<div class="compare"><div>'+renderQuestion(c.original)+'</div><div>'+renderQuestion(c.revised)+'</div></div>';
      if(c.v2) h+='<div class="callout warn" style="margin-top:10px">本案例在初版與第三版之間，還有一個出現<b>雙重答案</b>的第二版（第二版第 20 題），請點選「⚠ 第二版問題」查看。</div>';
      h+='<div class="dg" style="margin-top:10px"><div class="item fix"><h5>修訂原因</h5><p>'+esc(c.reason)+'</p></div></div>';
    }
    else if(t==="diag"){
      h='<div class="dg"><div class="item prob"><h5>品質問題</h5><p>'+esc(c.problem)+'</p></div><div class="item fix"><h5>修訂原因</h5><p>'+esc(c.reason)+'</p></div></div>';
      if(c.pending) h+='<div class="callout warn">'+esc(c.pending)+'</div>';
    }
    else if(t==="princ"){
      var rp=relatedPrinciples(c.id);
      h='<div class="dg"><div class="item pr"><h5>本案例的命題原則</h5><p>'+esc(c.principle)+'</p></div></div>';
      if(rp.length){h+='<p class="note" style="margin:10px 0 6px">對應「命題修訂策略館」的六項命題設計原則：</p><div class="princ">'+rp.map(function(p){return '<div class="pr-card"><h4><span class="pn">原則 '+p.n+'</span>'+esc(p.title)+'</h4><p>'+esc(p.desc)+'</p></div>';}).join("")+'</div>';}
    }
    if(t!=="diag" && c.pending && (t==="revised"||t==="compare")) h+='<div class="callout warn" style="margin-top:10px">'+esc(c.pending)+'</div>';
    body.innerHTML=h;
  }
  card.querySelector(".cc-tabs").addEventListener("click",function(e){var b=e.target.closest("button[data-t]");if(b)show(b.dataset.t);});
  card.querySelector(".cc-tabs").addEventListener("keydown",function(e){
    if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
    var bs=[].slice.call(card.querySelectorAll('[role="tab"]'));var i=bs.indexOf(document.activeElement);if(i<0)return;
    i=(i+(e.key==="ArrowRight"?1:-1)+bs.length)%bs.length;bs[i].focus();show(bs[i].dataset.t);e.preventDefault();
  });
  card._show=show;
  show(tabs[0][0]);
  return card;
}

function renderCasePicker(ids, building, container){
  var wrap=el('<div></div>');
  var pick=el('<div class="casepick" role="group" aria-label="選擇案例"></div>');
  var slot=el('<div></div>');
  ids.forEach(function(id){var c=CASE_BY_ID[id];
    pick.appendChild(el('<button type="button" data-case="'+id+'" aria-pressed="false"><b>案例 '+c.no+'</b>'+esc(c.title)+'</button>'));});
  wrap.appendChild(pick);wrap.appendChild(slot);
  function select(id, tab){
    pick.querySelectorAll("button").forEach(function(b){var on=b.dataset.case===id;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);});
    slot.innerHTML="";var card=renderCaseCard(CASE_BY_ID[id],building);slot.appendChild(card);
    if(tab) card._show(tab);
    return card;
  }
  pick.addEventListener("click",function(e){var b=e.target.closest("button[data-case]");if(b)select(b.dataset.case);});
  wrap._select=select;
  select(ids[0]);
  container.appendChild(wrap);
  return wrap;
}

/* 背景音樂：資料夾內有 bgm.mp3 才顯示按鈕。
   預設開啟：載入後先嘗試自動播放；瀏覽器擋下有聲自動播放時，等訪客第一次點擊、觸控或按鍵就開始播。
   訪客按「音樂」（或快捷鍵 M）關掉後，選擇會存在這台電腦的瀏覽器（localStorage），下次來就不會自動播放。 */
var BGM_SRC="bgm.mp3",BGM_VOLUME=0.35;
var musicBtn=document.getElementById("musicBtn"),bgm=null,bgmWanted=true;
try{ if(localStorage.getItem("ki-music")==="off") bgmWanted=false; }catch(e){}
function syncMusicBtn(){
  var on=!!bgm&&!bgm.paused;
  musicBtn.setAttribute("aria-pressed",on);
  musicBtn.title=(on?"暫停背景音樂":"播放背景音樂")+"（快捷鍵 M）";
}
function saveMusicPref(){ try{ localStorage.setItem("ki-music",bgmWanted?"on":"off"); }catch(e){} }
function toggleMusic(){
  if(!bgm||musicBtn.hidden)return;
  if(bgm.paused){bgmWanted=true;saveMusicPref();var p=bgm.play();if(p&&p.catch)p.catch(function(){syncMusicBtn();});}
  else{bgmWanted=false;saveMusicPref();bgm.pause();}
}
function autoStartMusic(){
  if(!bgm||!bgmWanted||!bgm.paused||document.hidden||musicBtn.hidden)return;
  var p=bgm.play();if(p&&p.catch)p.catch(function(){});
}
// 第一次互動就開始播放；如果第一下就是按「音樂」按鈕或 M 鍵，交給按鈕自己處理，避免一開就被關掉
var GESTURES=["pointerdown","keydown","touchend"];
function onFirstGesture(e){
  if(e.type==="keydown"&&(e.key==="m"||e.key==="M"||e.key==="Escape"))return;
  if(e.target&&e.target.closest&&e.target.closest("#musicBtn"))return;
  autoStartMusic();
}
function stopWaitingGesture(){ GESTURES.forEach(function(t){document.removeEventListener(t,onFirstGesture,true);}); }
try{
  bgm=new Audio();bgm.loop=true;bgm.volume=BGM_VOLUME;bgm.preload="auto";
  bgm.addEventListener("loadedmetadata",function(){musicBtn.hidden=false;autoStartMusic();});
  bgm.addEventListener("error",function(){musicBtn.hidden=true;stopWaitingGesture();});
  bgm.addEventListener("play",function(){syncMusicBtn();stopWaitingGesture();});
  bgm.addEventListener("pause",syncMusicBtn);
  GESTURES.forEach(function(t){document.addEventListener(t,onFirstGesture,true);});
  bgm.src=BGM_SRC;
  musicBtn.addEventListener("click",toggleMusic);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){if(!bgm.paused)bgm.pause();}
    else if(bgmWanted){var p=bgm.play();if(p&&p.catch)p.catch(function(){});}
  });
}catch(e){bgm=null;}

/* ---------------- 動畫開關 ----------------
   預設跟隨系統的「減少動態效果」設定；訪客按下方選單的「動畫」（或快捷鍵 A）後，改用訪客的選擇。

/* ---------------- 點擊音效 ----------------
   用瀏覽器內建的 Web Audio 即時合成「魔法鈴聲」，不需要額外音檔。
   預設開啟；訪客按下方選單的「音效」（或快捷鍵 S）可關閉，選擇只存在這台電腦的瀏覽器（localStorage）。
   一般按鈕：輕亮的叮聲；開啟建築：上行的閃爍琶音；關閉面板：下行的柔和兩音。 */
var sfxBtn=document.getElementById("sfxBtn");
var sfxOn=true;
try{ if(localStorage.getItem("ki-sfx")==="off") sfxOn=false; }catch(e){}
var sfxCtx=null,sfxBus=null,sfxLast=0;
function sfxReady(){
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  // 還沒有任何使用者操作時（例如網址直接帶 #history 開啟）不出聲
  if(navigator.userActivation && !navigator.userActivation.hasBeenActive)return null;
  if(!sfxCtx){
    sfxCtx=new AC();
    sfxBus=sfxCtx.createGain(); sfxBus.gain.value=0.22;
    var lp=sfxCtx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=7000;
    sfxBus.connect(lp); lp.connect(sfxCtx.destination);
  }
  if(sfxCtx.state==="suspended") sfxCtx.resume();
  return sfxCtx;
}
function sfxNote(ctx,freq,start,dur,vol,type){
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(vol,start+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g); g.connect(sfxBus);
  o.start(start); o.stop(start+dur+0.02);
  // 高八度的泛音，讓聲音更像鈴鐺
  var o2=ctx.createOscillator(),g2=ctx.createGain();
  o2.type="sine"; o2.frequency.setValueAtTime(freq*2.01,start);
  g2.gain.setValueAtTime(0.0001,start);
  g2.gain.exponentialRampToValueAtTime(vol*0.35,start+0.006);
  g2.gain.exponentialRampToValueAtTime(0.0001,start+dur*0.6);
  o2.connect(g2); g2.connect(sfxBus);
  o2.start(start); o2.stop(start+dur+0.02);
}
var SFX={
  tap:function(ctx,t){ sfxNote(ctx,1568,t,0.22,0.35,"triangle"); sfxNote(ctx,2349,t+0.045,0.28,0.22); },
  open:function(ctx,t){ [1047,1319,1568,2093].forEach(function(f,i){ sfxNote(ctx,f,t+i*0.06,0.5,0.28-i*0.03); }); sfxNote(ctx,3136,t+0.26,0.6,0.08); },
  close:function(ctx,t){ sfxNote(ctx,1568,t,0.25,0.22,"triangle"); sfxNote(ctx,1047,t+0.08,0.35,0.2,"triangle"); }
};
function playSfx(kind,force){
  if(!sfxOn && !force)return;
  var now=performance.now();
  if(kind==="tap" && now-sfxLast<120)return;   // 同一次點擊已經播過開啟／關閉音，不再疊加叮聲
  var ctx; try{ ctx=sfxReady(); }catch(e){ return; }
  if(!ctx||!SFX[kind])return;
  sfxLast=now;
  try{ SFX[kind](ctx,ctx.currentTime+0.01); }catch(e){}
}
function syncSfxBtn(){
  sfxBtn.setAttribute("aria-pressed",String(sfxOn));
  sfxBtn.querySelector(".ico").textContent=sfxOn?"♬":"♩";
  sfxBtn.title=(sfxOn?"關閉點擊音效":"開啟點擊音效")+"（快捷鍵 S）";
}
function toggleSfx(){
  sfxOn=!sfxOn;
  try{ localStorage.setItem("ki-sfx",sfxOn?"on":"off"); }catch(e){}
  syncSfxBtn();
  if(sfxOn) playSfx("tap",true);
  sfxLast=performance.now();
}

syncSfxBtn();
// 一般可點擊的東西（按鈕、分頁、展開框）都給一聲叮；放在 document 冒泡階段，晚於各按鈕自己的處理，
// 所以開啟建築或關閉面板時只會聽到對應的開啟／關閉音

/* 只有在 3D 程式真的沒載入時才報逾時。分頁在背景時瀏覽器不會畫第一幀（__islandReady 不會成立），
   但場景其實已經建好（__islandBuilt），這種情況不能誤報錯誤。 */
setTimeout(function(){ if(!window.__islandReady && !window.__islandBuilt && !window.__noWebGL && !window.__islandFailed){
  showError("3D 場景載入逾時：可能是網路無法連線至 Three.js 的 CDN（cdn.jsdelivr.net），或瀏覽器封鎖了外部程式。請確認網路後重新整理頁面。");
}},20000);

window.KI={open:open,close:close,home:home,isOpen:function(){return panel.classList.contains("open");},current:function(){return current;},
  hideLoading:hideLoading,showError:function(m){window.__islandFailed=true;showError(m);},isMobile:isMobile,motionReduced:motionReduced,
  names:{history:BUILDINGS.history.name,diagnosis:BUILDINGS.diagnosis.name,strategy:BUILDINGS.strategy.name},
  // 主題副標（取自各館 kicker，例如「古卷圖書館」），名牌在滑鼠移入時顯示
  subs:{history:BUILDINGS.history.kicker.split("｜")[1],diagnosis:BUILDINGS.diagnosis.kicker.split("｜")[1],strategy:BUILDINGS.strategy.kicker.split("｜")[1]},
  panelEl:panel};

/* 以網址 #history 等直接開啟 */
var h=(location.hash||"").replace("#","");
if(BUILDINGS[h]) setTimeout(function(){open(h);},window.__noWebGL?0:900);
})();

<script type="importmap">
{ "imports": {

<script type="module">

function init(){
// 是否關閉動畫：由下方選單的「動畫」開關決定（預設跟隨系統設定），切換時立即生效

const viewAspect = () => Math.max(innerWidth, 1) / Math.max(innerHeight, 1);
const camera = new THREE.PerspectiveCamera(35, viewAspect(), 0.5, 400);

/* ---------- lights：黃昏的低角度暖色夕陽（投影）＋紫藍天光＋冷色補光 ---------- */
scene.add(new THREE.HemisphereLight(0xb9b2ff, 0x5a4460, 1.3));
const sun = new THREE.DirectionalLight(0xffc089, 2.5);          // 夕陽，從畫面左前方低角度照過來
sun.position.set(-10, 15, 24);

Object.assign(sun.shadow.camera, { left:-25, right:25, top:25, bottom:-25, near:1, far:95 });

scene.add(new THREE.AmbientLight(0x9a8fc0, 0.4));

/* ---------- helpers ---------- */
const matCache = new Map();
function mat(color, opts){
  const key = color + JSON.stringify(opts||{});
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshLambertMaterial(Object.assign({ color, flatShading:true }, opts||{})));
  return matCache.get(key);
}
function mesh(geo, m, cast=true, recv=true){ const o = new THREE.Mesh(geo, m); o.castShadow = cast; o.receiveShadow = recv; return o; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261113);
function hash3(x,y,z){ const s = Math.sin(x*12.9898 + y*78.233 + z*37.719) * 43758.5453; return s - Math.floor(s); }
function jitter(geo, amt, yAmt){
  const p = geo.attributes.position;
  for (let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const h1 = hash3(+x.toFixed(3), +y.toFixed(3), +z.toFixed(3));
    const h2 = hash3(+z.toFixed(3)+3.1, +x.toFixed(3), +y.toFixed(3)+1.7);
    const r = Math.hypot(x,z);
    if (r > 0.01){ const k = 1 + (h1-0.5)*amt; p.setX(i, x*k); p.setZ(i, z*k); }
    p.setY(i, y + (h2-0.5)*(yAmt||0));
  }
  geo.computeVertexNormals();
  return geo;
}
function textTexture(text, { w=512, h=128, bg="#fffaf0", fg="#2d3a2e", font="900 64px", border=null, radius=24 }={}){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  const draw = () => {
    g.clearRect(0,0,w,h);
    g.fillStyle = bg; roundRect(g, 4, 4, w-8, h-8, radius); g.fill();
    if (border){ g.lineWidth = 8; g.strokeStyle = border; roundRect(g, 8, 8, w-16, h-16, radius-4); g.stroke(); }
    g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = font + ' "Noto Serif TC","Songti TC","PMingLiU","Noto Sans TC",serif';
    g.fillText(text, w/2, h/2 + 4);
  };
  draw();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ draw(); t.needsUpdate = true; });
  return t;
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ---------- palette ---------- */
const C = {
  grass:0x78ad62, grass2:0x63984f, dirt:0x9a7050, dirt2:0x805c40, rock:0x7d7484, rock2:0x675f74,
  stone:0xd6cab0, stone2:0xbcae92, wood:0x9a6a42, woodD:0x6b4528, cream:0xe9dcc0, white:0xf3ecdc,
  blue:0x3d6fc0, blueD:0x264f93, orange:0xd9782b, orangeD:0xa8521a, green:0x3f9658, greenD:0x2a6b3d,
  leaf1:0x5fa955, leaf2:0x47904a, leaf3:0x86c060, pine:0x357a4e, water:0x5cb2e6, glass:0xffcf7a,
  dark:0x2c2a35, metal:0xb9c3cc, red:0xb8434e, yellow:0xe9c15a, pink:0xe991ad,
  castle:0xc2b8a6, castle2:0xa89d8a, slate:0x3c4478, slateD:0x2b315c, brass:0xc9a24a, wine:0x7a2a3a
};
/* 會發光的材質（窗戶、燈、魔藥）：不參與滑鼠移過的高亮，避免光被蓋掉 */
function glow(color, intensity=1){ const m = new THREE.MeshLambertMaterial({ color, emissive:color, emissiveIntensity:intensity, flatShading:true }); m.userData.glow = true; return m; }
const WIN = glow(0xffc46b, 1.0);

/* ---------- island ---------- */
const world = new THREE.Group(); scene.add(world);
const island = new THREE.Group(); world.add(island);
const Y0 = 0.5;

const top = mesh(jitter(new THREE.CylinderGeometry(11, 10.7, 1, 18, 1), 0.07, 0), mat(C.grass));
island.add(top);
const rim = mesh(jitter(new THREE.CylinderGeometry(10.75, 10.2, 0.7, 18, 1), 0.07, 0), mat(C.grass2));
rim.position.y = -0.8; island.add(rim);
const dirt = mesh(jitter(new THREE.CylinderGeometry(10.25, 9.2, 1.4, 16, 1), 0.08, 0.15), mat(C.dirt));
dirt.position.y = -1.85; island.add(dirt);
const rockG = new THREE.ConeGeometry(10.1, 9.5, 14, 5); rockG.rotateX(Math.PI);
const rock = mesh(jitter(rockG, 0.28, 0.5), mat(C.rock)); rock.position.y = -2.5 - 4.75; island.add(rock);
const rock2G = new THREE.ConeGeometry(4.5, 5, 9, 3); rock2G.rotateX(Math.PI);
const rockB = mesh(jitter(rock2G, 0.35, 0.4), mat(C.rock2)); rockB.position.set(3.4, -6.2, 2.2); island.add(rockB);
const rockC = mesh(jitter(new THREE.ConeGeometry(3.4, 4, 8, 2).rotateX(Math.PI), 0.35, 0.3), mat(C.rock2)); rockC.position.set(-4.2, -5.4, 3.6); island.add(rockC);
// floating pebbles
const pebbles = [];
[[-12.5,-3.5,3,0.9],[11.5,-5,-6,0.7],[6,-9.5,10,0.55],[-8,-8,-9,0.6]].forEach(([x,y,z,s],i)=>{
  const g = new THREE.DodecahedronGeometry(s, 0); const m = mesh(jitter(g,0.3,0.2), mat(i%2?C.rock:C.rock2));
  const cap = mesh(new THREE.CylinderGeometry(s*0.9, s*0.95, s*0.35, 7), mat(C.grass)); cap.position.y = s*0.62;
  const grp = new THREE.Group(); grp.add(m, cap); grp.position.set(x,y,z); grp.userData = { y0:y, ph:i*1.7 };
  island.add(grp); pebbles.push(grp);
});

/* ---------- layout ---------- */
const V = new THREE.Vector3(1,0,1).normalize();      // toward default camera
const P = new THREE.Vector3(1,0,-1).normalize();     // screen-right
const at = (side, depth) => P.clone().multiplyScalar(side).add(V.clone().multiplyScalar(depth));
const plaza = at(0, 0.9);
const BPOS = { history: at(-5.7, 0.4), diagnosis: at(0, -5.6), strategy: at(5.7, 0.4) };
const blockers = []; // {p:Vector3, r}

/* plaza */
const plazaDisk = mesh(new THREE.CylinderGeometry(1.9, 1.95, 0.12, 10), mat(C.stone), false, true);
plazaDisk.position.set(plaza.x, Y0+0.05, plaza.z); island.add(plazaDisk);
const plazaRing = mesh(new THREE.TorusGeometry(1.9, 0.09, 4, 20), mat(C.stone2), false, true);
plazaRing.rotation.x = Math.PI/2; plazaRing.position.set(plaza.x, Y0+0.1, plaza.z); island.add(plazaRing);
blockers.push({ p: plaza.clone(), r: 2.6 });

/* stepping-stone paths */
const slabGeo = new THREE.CylinderGeometry(0.4, 0.44, 0.1, 6);
const slabMats = [mat(C.stone), mat(C.stone2)];
const pathPts = [];
function path(a, b, bend){
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const dir = b.clone().sub(a); const len = dir.length(); dir.normalize();
  const perp = new THREE.Vector3(-dir.z, 0, dir.x);
  const ctrl = mid.clone().add(perp.multiplyScalar(bend));
  const curve = new THREE.QuadraticBezierCurve3(a, ctrl, b);
  const n = Math.max(3, Math.round(len / 0.72));
  for (let i=0;i<=n;i++){
    const t = i/n, p = curve.getPoint(t), tan = curve.getTangent(t);
    const side = (i%2 ? 0.16 : -0.16);
    const off = new THREE.Vector3(-tan.z, 0, tan.x).multiplyScalar(side);
    const s = mesh(slabGeo, slabMats[i%2], false, true);
    s.position.set(p.x+off.x, Y0+0.04, p.z+off.z); s.rotation.y = R()*Math.PI; s.scale.setScalar(0.9 + R()*0.25);
    island.add(s); pathPts.push(p.clone());
  }
}

/* ---------- decorations shared ---------- */
const trunkGeo = new THREE.CylinderGeometry(0.12, 0.17, 0.9, 6);
const roundLeafGeo = new THREE.IcosahedronGeometry(0.8, 0);
const pineGeo = new THREE.ConeGeometry(0.75, 1.4, 7);
const bushGeo = new THREE.IcosahedronGeometry(0.45, 0);
const swayers = [];
const LAMP_MAT = glow(0xffd58a, 1.3);
let lampLights = 0;
/* 柔和光暈（加法混色的貼圖精靈），用於燈、蠟燭、月亮 */
const GLOW_TEX = (()=>{ const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(0.25,"rgba(255,255,255,.55)"); gr.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0,0,64,64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
function glowSprite(color, size, y=0){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:GLOW_TEX, color, transparent:true, opacity:0.55, depthWrite:false, blending:THREE.AdditiveBlending }));
  s.scale.setScalar(size); s.position.y = y; return s;
}
function tree(x, z, s=1, kind=0){
  const g = new THREE.Group();
  const t = mesh(trunkGeo, mat(C.woodD)); t.position.y = 0.45; g.add(t);
  if (kind === 0){
    const a = mesh(roundLeafGeo, mat([C.leaf1,C.leaf2,C.leaf3][Math.floor(R()*3)])); a.position.y = 1.35; a.scale.set(1,1.1,1); g.add(a);
    const b = mesh(roundLeafGeo, mat(C.leaf1)); b.position.set(0.35, 1.0, 0.15); b.scale.setScalar(0.55); g.add(b);
  } else {
    const a = mesh(pineGeo, mat(C.pine)); a.position.y = 1.25; g.add(a);
    const b = mesh(pineGeo, mat(C.pine)); b.position.y = 1.9; b.scale.setScalar(0.72); g.add(b);
  }
  g.position.set(x, Y0, z); g.scale.setScalar(s); g.rotation.y = R()*6.28;
  g.userData.ph = R()*6.28; island.add(g); swayers.push(g);
  return g;
}
function bush(x,z,s=1){ const b = mesh(bushGeo, mat(R()<0.5?C.leaf2:C.leaf1)); b.position.set(x, Y0+0.25*s, z); b.scale.set(s, s*0.8, s); island.add(b); }
function lamp(x,z){
  const g = new THREE.Group();
  const post = mesh(new THREE.CylinderGeometry(0.06,0.08,1.6,6), mat(C.dark)); post.position.y = 0.8; g.add(post);
  const cap = mesh(new THREE.ConeGeometry(0.26,0.22,6), mat(C.dark)); cap.position.y = 1.93; g.add(cap);
  const light = mesh(new THREE.BoxGeometry(0.28,0.3,0.28), LAMP_MAT, false, false); light.position.y = 1.72; g.add(light);
  // 實際照亮周圍的暖光（手機只開兩盞，省電）
  if (lampLights < (coarse ? 2 : 4)){ const pl = new THREE.PointLight(0xffb45c, 7, 9, 2); pl.position.y = 1.72; g.add(pl); lampLights++; }
  g.add(glowSprite(0xffc46b, 1.6, 1.72));
  g.position.set(x, Y0, z); island.add(g);
}
function free(x, z, r=1){
  if (Math.hypot(x,z) > 9.8) return false;
  for (const b of blockers) if (Math.hypot(x-b.p.x, z-b.p.z) < b.r + r) return false;
  for (const p of pathPts) if (Math.hypot(x-p.x, z-p.z) < 0.75 + r*0.6) return false;
  return true;
}

/* ---------- buildings ---------- */
const buildings = {};
function gable(w, h, d, color){
  const s = new THREE.Shape(); s.moveTo(-w/2,0); s.lineTo(w/2,0); s.lineTo(0,h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:d, bevelEnabled:false }); g.translate(0,0,-d/2);
  return mesh(g, mat(color));
}
function box(w,h,d,color){ return mesh(new THREE.BoxGeometry(w,h,d), mat(color)); }
function cyl(rt,rb,h,seg,color){ return mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color)); }

function buildHistory(){
  const g = new THREE.Group();
  const base = box(4.0,0.3,3.5,C.stone); base.position.y = 0.15; g.add(base);
  const steps = box(1.4,0.16,0.5,C.stone2); steps.position.set(0,0.08,1.95); g.add(steps);
  const walls = box(3.2,2.0,2.6,C.cream); walls.position.y = 1.3; g.add(walls);
  const band = box(3.3,0.18,2.7,0xe9dcc0); band.position.y = 2.32; g.add(band);
  const roof = gable(3.9,1.35,3.4,C.blue); roof.position.y = 2.4; g.add(roof);
  const ridge = box(0.18,0.18,3.5,C.blueD); ridge.position.y = 3.72; g.add(ridge);
  const gableFront = gable(3.3,1.12,0.06,C.cream); gableFront.position.set(0,2.42,1.62); g.add(gableFront);
  [-1.25,-0.45,0.45,1.25].forEach(x=>{ const c = cyl(0.11,0.13,1.95,8,C.white); c.position.set(x,1.27,1.55); g.add(c); });
  const door = box(0.75,1.15,0.06,C.woodD); door.position.set(0,0.88,1.33); door.scale.x = 0.5; door.position.x = -0.19; g.add(door);   // 半開的門
  const knob = box(0.08,0.08,0.06,C.yellow); knob.position.set(-0.05,0.88,1.37); g.add(knob);
  [[-1.62,1.35,0],[1.62,1.35,0]].forEach(([x,y,z])=>{ for (const dz of [-0.6,0.6]){ const w = mesh(new THREE.BoxGeometry(0.06,0.7,0.5), WIN, false, false); w.position.set(x,y,z+dz); g.add(w);} });
  // 門縫透出的燈光
  const doorGlow = mesh(new THREE.BoxGeometry(0.62,1.0,0.04), WIN, false, false); doorGlow.position.set(0,0.82,1.305); g.add(doorGlow);
  // clock on gable
  const clockFace = cyl(0.42,0.42,0.06,16,C.white); clockFace.rotation.x = Math.PI/2; clockFace.position.set(0,2.85,1.68); g.add(clockFace);
  const clockRim = mesh(new THREE.TorusGeometry(0.43,0.06,6,16), mat(C.blueD)); clockRim.position.set(0,2.85,1.7); g.add(clockRim);
  const hourHand = box(0.05,0.22,0.03,C.dark); hourHand.geometry.translate(0,0.1,0); hourHand.position.set(0,2.85,1.73); g.add(hourHand);
  const minHand = box(0.035,0.32,0.03,C.dark); minHand.geometry.translate(0,0.15,0); minHand.position.set(0,2.85,1.75); g.add(minHand);
  g.userData.anim = (t)=>{ minHand.rotation.z = -t*0.6; hourHand.rotation.z = -t*0.05; };
  // flag
  const pole = cyl(0.03,0.03,1.2,5,C.dark); pole.position.set(1.3,3.4,-0.9); g.add(pole);   // 底部插進屋頂斜面
  const flag = box(0.5,0.3,0.02,C.yellow); flag.position.set(1.56,3.85,-0.9); g.add(flag);
  // big books stack
  const books = new THREE.Group();
  [[C.red,0],[C.yellow,0.24],[0x4fb3a5,0.48]].forEach(([c,y],i)=>{ const b = box(0.95-i*0.08,0.22,0.68,c); b.position.y = 0.11+y; b.rotation.y = i*0.25; books.add(b);
    const pages = box(0.9-i*0.08,0.16,0.04,C.white); pages.position.set(0,0.11+y,0.33); pages.rotation.y = i*0.25; books.add(pages); });
  books.position.set(2.6,0,1.15); g.add(books);   // 整疊放在底座旁的草地上
  // open book on stand（書架立在草地上）
  const stand = box(0.08,0.86,0.08,C.woodD); stand.position.set(-2.45,0.43,1.25); g.add(stand);
  const pageL = box(0.42,0.04,0.55,C.white); pageL.position.set(-2.64,0.9,1.25); pageL.rotation.z = 0.25; g.add(pageL);
  const pageR = box(0.42,0.04,0.55,C.white); pageR.position.set(-2.26,0.9,1.25); pageR.rotation.z = -0.25; g.add(pageR);
  // scroll（平放在草地上，避開台階）
  const scroll = cyl(0.14,0.14,0.85,10,0xf3e6c4); scroll.rotation.z = Math.PI/2; scroll.position.set(-1.65,0.17,2.25); g.add(scroll);
  [-0.47,0.47].forEach(x=>{ const e = cyl(0.17,0.17,0.08,10,C.red); e.rotation.z = Math.PI/2; e.position.set(-1.65+x,0.17,2.25); g.add(e); });
  return g;
}

function gear(r, teeth, thick, color){
  const g = new THREE.Group();
  const body = cyl(r, r, thick, 14, color); body.rotation.x = Math.PI/2; g.add(body);
  const hub = cyl(r*0.35, r*0.35, thick*1.4, 8, C.dark); hub.rotation.x = Math.PI/2; g.add(hub);
  for (let i=0;i<teeth;i++){ const a = i/teeth*Math.PI*2; const t = box(r*0.32, r*0.32, thick, color); t.position.set(Math.cos(a)*r, Math.sin(a)*r, 0); t.rotation.z = a; g.add(t); }
  return g;
}

/* ---------- Tripo 模型：載入成功就取代程式繪製的簡易建築；載入失敗則保留簡易版 ---------- */
/* 每個項目：url 檔案、group 要取代的建築群組、height 目標高度、maxW 佔地上限（兩者取較小的縮放）、
   y 底部高度、rotY 轉向（模型正面預設朝 +Z，也就是朝向廣場） */
const MODELS = {
  history:   { url:"models/library.glb",  group:()=>buildings.history.group,  height:4.6, maxW:4.5 },
  strategy:  { url:"models/workshop.glb", group:()=>buildings.strategy.group, height:4.4, maxW:4.4 },

  diagnosis: { url:"models/observatory.glb", group:()=>buildings.diagnosis.group, height:5.0,   // 略降高度，少擋後方城堡入口
    onSwap(g){ if (g.userData.mag) g.userData.mag.position.x = -2.95; } }   // 放大鏡往外移，避開較寬的模型
};
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;   // 只影響模型的 PBR 材質（金屬反光用）
const gltfLoader = new GLTFLoader();
function swapInModel(cfg, gltf){
    const g = cfg.group(), model = gltf.scene;
    const bb = new THREE.Box3().setFromObject(model), size = bb.getSize(new THREE.Vector3()), ctr = bb.getCenter(new THREE.Vector3());
    let s = cfg.height / size.y;
    if (cfg.maxW) s = Math.min(s, cfg.maxW / Math.max(size.x, size.z));
    model.scale.setScalar(s);
    model.position.set(-ctr.x*s, -bb.min.y*s, -ctr.z*s);          // 置中、底部貼地
    const holder = new THREE.Group(); holder.userData.keep = true; holder.userData.model = true;
    holder.position.set(cfg.x || 0, cfg.y || 0, cfg.z || 0); holder.rotation.y = cfg.rotY || 0; holder.add(model);
    const mats = (g.userData.mats ||= []);
    model.traverse(o=>{
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = true;
      const m = o.material; m.envMapIntensity = 0.55;
      // 用貼圖本身當自發光來源：黃色窗戶會比石牆亮，滑鼠移過時也能整棟提亮
      if (m.map){ m.emissiveMap = m.map; m.userData.em0 = 0.12; m.emissive.setRGB(0.12,0.12,0.12); mats.push(m); }   // 0.22 → 0.12：石牆不再整片發亮，窗光仍是最亮處
    });
    for (const c of g.children) if (!c.userData.keep) c.visible = false;
    g.add(holder);
    g.userData.modelTop = (cfg.y || 0) + size.y * s;              // 模型實際高度，名牌位置會跟著調整
    if (cfg.onSwap) cfg.onSwap(g);
    window.__modelsLoaded = (window.__modelsLoaded || 0) + 1;
}
/* 下載一個檔案；連續 stallMs 毫秒沒有收到任何資料就中斷（看的是「停滯」，不是總時間，慢速網路不會被誤判）。 */
async function fetchBuffer(url, stallMs = 6000){
  const ac = new AbortController(); let timer;
  const arm = ()=>{ clearTimeout(timer); timer = setTimeout(()=> ac.abort(), stallMs); };
  arm();
  try {
    const res = await fetch(url, { signal: ac.signal });
    if (!res.ok) throw Object.assign(new Error("HTTP " + res.status), { permanent: res.status >= 400 && res.status < 500 });
    const reader = res.body.getReader(), chunks = []; let len = 0;
    for (;;){ const { done, value } = await reader.read(); if (done) break; chunks.push(value); len += value.length; arm(); }
    const out = new Uint8Array(len); let o = 0;
    for (const c of chunks){ out.set(c, o); o += c.length; }
    return out.buffer;
  } finally { clearTimeout(timer); }
}
/* 一次載入一個模型；下載中斷或停滯時自動重試（最多共 4 次）。全部失敗就保留簡易建築。 */
async function loadModel(cfg){
  const TRIES = 4;
  for (let attempt = 0; attempt < TRIES; attempt++){
    try {
      const gltf = await gltfLoader.parseAsync(await fetchBuffer(cfg.url), "models/");
      swapInModel(cfg, gltf);
      return;
    } catch (err){
      if (attempt === TRIES - 1 || err.permanent){ console.warn("模型載入失敗，保留簡易建築：" + cfg.url, err); return; }
      await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
    }
  }
}
(async ()=>{ for (const id in MODELS) await loadModel(MODELS[id]); window.__modelsDone = true; })();

function spotNear(bGroup, candidates){
  const v = new THREE.Vector3();
  for (const [lx,lz] of candidates){
    v.set(lx,0,lz).applyAxisAngle(new THREE.Vector3(0,1,0), bGroup.rotation.y).add(bGroup.position);
    let ok = Math.hypot(v.x,v.z) < 9.6;
    for (const b of blockers){ if (b.r === 2.9 || b.r === 2.6) continue; if (Math.hypot(v.x-b.p.x, v.z-b.p.z) < b.r + 0.45){ ok = false; break; } }
    if (ok) return [lx,lz];
  }
  return candidates[0];
}

/* ---------- cinematic camera flights: arc around the target, not a straight line ---------- */
let tween = null;
const easeInOut = t => t < 0.5 ? 16*t*t*t*t*t : 1 - Math.pow(-2*t + 2, 5)/2;      // quintic: 起步與停下都很柔
const easeOutTarget = t => 1 - Math.pow(1 - t, 3);
const sph0 = new THREE.Spherical(), sph1 = new THREE.Spherical(), sphT = new THREE.Spherical();
function flyTo(pos, target){
  zoomGoal = null;

  sph0.setFromVector3(p0.clone().sub(t0)); sph1.setFromVector3(pos.clone().sub(target));
  let dTheta = sph1.theta - sph0.theta;
  dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));               // 走最短的旋轉方向
  const travel = Math.abs(dTheta) * 8 + Math.abs(sph1.radius - sph0.radius) + t0.distanceTo(target);
  // 減少動態效果：不繞弧線、不拉高，改成約 0.35 秒的直線平移，避免瞬間跳動又不造成大幅晃動
  const dur = REDUCED ? 350 : THREE.MathUtils.clamp(900 + travel * 28, 1100, 1900);
  const lift = REDUCED ? 0 : Math.min(0.12, Math.abs(dTheta) * 0.08) * Math.max(sph0.radius, sph1.radius);  // 轉大角度時略微拉遠，像空拍
  tween = { reduced: REDUCED, t0, t1: target.clone(), p0, p1: pos.clone(), r0: sph0.radius, r1: sph1.radius, ph0: sph0.phi, ph1: sph1.phi, th0: sph0.theta, dTheta, lift, start: performance.now(), dur };

function stepTween(now){

    const e = easeOutTarget(k);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.position.lerpVectors(tween.p0, tween.p1, e);

  sphT.phi = THREE.MathUtils.lerp(tween.ph0, tween.ph1, e);
  sphT.theta = tween.th0 + tween.dTheta * e;

  if (k >= 1){ tween = null; controls.enabled = true; controls.update(); }
}

    el.style.display = "";
    // 投影矩陣已經包含畫面平移（setViewOffset），這裡不可以再扣一次 viewShift，否則面板打開時名牌會偏離建築
    const x = (tmpV.x*0.5 + 0.5) * w; let y = (-tmpV.y*0.5 + 0.5) * h;
    // 標籤若被左上標題卡或下方選單蓋住，就移到它們旁邊，維持可讀、可點
    const [lw, lh] = sizes[id], GAP = 6, ARROW = 6;
    const overlapsX = r => r && r.width > 0 && x + lw/2 > r.left - GAP && x - lw/2 < r.right + GAP;
    // 標籤本體在 y 上方（高 lh），小箭頭在 y 下方（高 ARROW）
    if (overlapsX(tb) && y - lh < tb.bottom + GAP && y + ARROW > tb.top - GAP) y = tb.bottom + GAP + lh;
    if (overlapsX(dk) && y + ARROW > dk.top - GAP && y - lh < dk.bottom + GAP) y = dk.top - GAP - ARROW;
    el.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) translate(-50%, -100%)`;
    el.style.zIndex = String(1000 - Math.round(camDist*10));
  }
}

/* ---------- picking & hover ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hovered = null, charHovered = null, charTapTimer = 0;
const pickTargets = [...hitboxes, ...charHits];
/* 取最靠近鏡頭的建築或角色：角色站在建築前面時，以角色為準 */
function pickAny(cx, cy){
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left)/r.width)*2 - 1, -((cy - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickTargets, false)[0];
  if (!hit) return null;
  return hit.object.userData.charId ? { char:true, id:hit.object.userData.charId } : { char:false, id:hit.object.userData.id };
}
function pick(cx, cy){ const h = pickAny(cx, cy); return h && !h.char ? h.id : null; }
function setCharHover(id){ if (charHovered !== id){ charHovered = id; clearTimeout(charTapTimer); } }
function setHover(id){
  hovered = id;
  for (const k in labels) labels[k].classList.toggle("hot", k === id);
  canvas.style.cursor = id ? "pointer" : "grab";
}
let down = null;
canvas.addEventListener("pointerdown", e=>{ cancelTween(); zoomGoal = null; down = { x:e.clientX, y:e.clientY, t:performance.now() }; if (e.pointerType === "mouse") canvas.style.cursor = "grabbing"; });
canvas.addEventListener("pointermove", e=>{ if (e.pointerType !== "mouse" || (down && e.buttons)) return;
  const h = pickAny(e.clientX, e.clientY); setHover(h && !h.char ? h.id : null); setCharHover(h && h.char ? h.id : null); });
canvas.addEventListener("pointerleave", ()=>{ setHover(null); setCharHover(null); });
window.addEventListener("pointerup", e=>{
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  const wasOnCanvas = e.target === canvas; down = null;
  if (e.pointerType === "mouse") setHover(wasOnCanvas ? pick(e.clientX, e.clientY) : null);
  if (wasOnCanvas && moved < (e.pointerType === "mouse" ? 6 : 12) && dt < 700){
    const h = pickAny(e.clientX, e.clientY);
    if (h && h.char){   // 點到角色：打招呼 3.5 秒（手機沒有滑鼠移入，用點一下代替）
      setCharHover(h.id); const id = h.id;
      charTapTimer = setTimeout(()=>{ if (charHovered === id) charHovered = null; }, 3500);
    } else if (h) KI.open(h.id);
  }
});
canvas.style.cursor = "grab";

/* ---------- public API used by the panel ---------- */
let focusedId = null, panelOpen = false;
window.Island3D = {
  focus(id){
    const b = buildings[id]; if (!b) return;
    focusedId = id; panelOpen = true; bumpIdle();
    const target = new THREE.Vector3(); b.group.getWorldPosition(target); target.y += 1.2;
    const front = plaza.clone().sub(b.pos).setY(0).normalize();
    const dir = front.multiplyScalar(0.78).add(new THREE.Vector3(0,0.62,0)).add(V.clone().multiplyScalar(0.25)).normalize();
    const dist = KI.isMobile() ? 24 : 29;
    flyTo(target.clone().addScaledVector(dir, dist), target);
    viewShiftTarget = panelShift(true);
  },
  panelChanged(open){ panelOpen = open; viewShiftTarget = panelShift(open); },
  home(){
    focusedId = null; panelOpen = false; viewShiftTarget = 0; bumpIdle();
    hd = updateLimits();
    flyTo(HOME_TARGET.clone().addScaledVector(HOME_DIR, hd), HOME_TARGET);
  }
};

/* ---------- resize ---------- */
function onResize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = viewAspect(); camera.updateProjectionMatrix();
  const old = hd; hd = updateLimits();
  // 萬一鏡頭位置已經壞掉（NaN），直接回到島嶼全景位置
  const broken = !Number.isFinite(camera.position.x + camera.position.y + camera.position.z);
  if (broken){
    tween = null; zoomGoal = null; controls.enabled = true;
    controls.target.copy(HOME_TARGET);
    camera.position.copy(HOME_TARGET).addScaledVector(HOME_DIR, hd);
    controls.update();
  } else if (!focusedId && !tween && Math.abs(camera.position.distanceTo(controls.target) - old) < 0.5){
    // 先算好方向再移動鏡頭；若先 copy 再算方向，方向會變成 0，鏡頭會掉到目標點上
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, hd);
  }
  viewShiftTarget = panelShift(panelOpen);
}
addEventListener("resize", onResize);
addEventListener("orientationchange", ()=> setTimeout(onResize, 200));

/* ---------- adaptive resolution: keep the frame rate smooth on slower devices ---------- */
const maxDPR = Math.min(devicePixelRatio || 1, coarse ? 1.75 : 2);
let curDPR = maxDPR, fpsAcc = 0, fpsN = 0, fpsCheck = performance.now() + 2500;
function adaptQuality(dt, now){
  fpsAcc += dt; fpsN++;
  if (now < fpsCheck) return;
  const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; fpsCheck = now + 2000;
  let next = curDPR;
  if (fps < 45 && curDPR > 1) next = Math.max(1, curDPR - 0.25);
  else if (fps > 58 && curDPR < maxDPR) next = Math.min(maxDPR, curDPR + 0.25);
  if (next !== curDPR){ curDPR = next; renderer.setPixelRatio(curDPR); renderer.setSize(innerWidth, innerHeight, false); }
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let first = true, skipped = false;
function frame(now){
  requestAnimationFrame(frame);
  // mobile: panel covers everything, skip rendering to save battery
  if (panelOpen && KI.isMobile() && !tween && !first){ skipped = true; return; }
  let dt = clock.getDelta(); const t = clock.elapsedTime;
  if (skipped){ dt = 0.016; skipped = false; }
  dt = Math.min(dt, 0.05);
  if (!first) adaptQuality(dt, now);

  // idle auto-rotate, eased so it never starts or stops abruptly
  const idle = !panelOpen && !tween && !REDUCED && (now - lastInteract > 7000);
  autoSpeed += ((idle ? 0.35 : 0) - autoSpeed) * damp(idle ? 0.8 : 6, dt);
  controls.autoRotate = autoSpeed > 0.002; controls.autoRotateSpeed = autoSpeed;

  stepTween(now);
  if (!tween){ stepZoom(dt); controls.update(dt); }
  viewShift += (viewShiftTarget - viewShift) * damp(REDUCED ? 14 : 5.5, dt);   // 減少動態時也用很快的滑動，不直接跳
  viewShiftY += (viewShiftYTarget - viewShiftY) * (first ? 1 : damp(REDUCED ? 14 : 5.5, dt));
  applyViewOffset();
  if (!REDUCED){
    island.position.y = Math.sin(t*0.6)*0.14;
    for (const s of swayers){ s.rotation.z = Math.sin(t*1.1 + s.userData.ph)*0.025; s.rotation.x = Math.cos(t*0.9 + s.userData.ph)*0.018; }
    for (const p of pebbles){ p.position.y = p.userData.y0 + Math.sin(t*0.8 + p.userData.ph)*0.3; p.rotation.y = t*0.1 + p.userData.ph; }
    for (const c of clouds){ c.userData.a += c.userData.sp * dt; c.position.set(Math.cos(c.userData.a)*c.userData.r, c.userData.y + Math.sin(t*0.3 + c.userData.r)*0.3, Math.sin(c.userData.a)*c.userData.r); c.rotation.y = -c.userData.a; }
    for (const id in buildings){ const a = buildings[id].group.userData.anim; if (a) a(t); }
    magicRing.rotation.y = t*0.06;
    placeCandles(t); placeFireflies(t);
    for (const tx of falls) tx.offset.y = (tx.offset.y + dt*0.55) % 1;
  }
  // 雲只要比島嶼中心更靠近鏡頭就淡出，避免擋在島前面
  const camToTarget = camera.position.distanceTo(controls.target);
  for (const c of clouds){
    const d = c.position.distanceTo(camera.position);
    const goal = Math.min(THREE.MathUtils.clamp((d - 22) / 14, 0, 0.95), THREE.MathUtils.clamp((d - camToTarget - 4) / 10, 0, 0.95));
    c.userData.mat.opacity += (goal - c.userData.mat.opacity) * damp(4, dt);
    c.visible = c.userData.mat.opacity > 0.02;
  }
  // 島上角色：動畫開啟時各自做事；被滑鼠移到時平滑轉成打招呼（走路的角色會停下來）
  for (const a of actors){
    const want = charHovered === a.id ? 1 : 0;
    a.k = REDUCED ? want : a.k + (want - a.k) * damp(want ? 8 : 5, dt);
    if (!REDUCED) a.lt += dt * (a.pauseOnHover ? 1 - a.k : 1);
    a.update(a.lt);                                  // 每幀都重設姿勢，打招呼結束後會自然回到原本動作
    if (!a.moves) a.node.position.y = a.y0;
    if (a.k > 0.005 && a.react) a.react(a.k, t);
  }
  updateSparkles(t, dt, hovered);
  // hover / focus highlight
  for (const id in buildings){
    const b = buildings[id];
    const on = (hovered === id) || (focusedId === id && panelOpen && KI.current() === id);   // 切到其他面板（例如網站說明）時熄掉光環
    b.hover += ((on ? 1 : 0) - b.hover) * damp(on ? 10 : 6, dt);
    const s = 1 + b.hover*0.035; b.group.scale.setScalar(s);
    for (const m of b.group.userData.mats){ const e0 = m.userData.em0 || 0; m.emissive.setRGB(e0 + 0.16*b.hover, e0 + 0.13*b.hover, e0 + 0.06*b.hover); }
    hoverRings[id].material.opacity = 0.55*b.hover;
  }
  renderer.render(scene, camera);
  updateLabels();
  updateBubble();
  if (first){ first = false; window.__islandReady = true; KI.hideLoading(); }
}
requestAnimationFrame(frame);
window.__islandBuilt = true;   // 場景已建立完成（第一幀要等分頁顯示時才會畫）
}
</script>
</body>
</html>
